# The release of the .apk package for wg-portal.
#
# The workflow looks for a new release of the portal (h44z/wg-portal) — every
# two weeks and on every commit to master. If there is one, it builds the
# package for the router, checks it in the emulated OpenWrt and publishes the
# .apk as a release of this repository.
#
# The version of the release is four numbers: the three of the version of the
# portal and the fourth one is the revision of the packaging.
#
# The state of the workflow is the release itself: if the version of the
# portal is already released here, the run does nothing.
name: wg-portal release

on:
  schedule:
    # The 1st and the 15th of the month, 06:17 UTC. GitHub runs the scheduled
    # workflows with a delay, and the top of the hour is crowded.
    - cron: "17 6 1,15 * *"
  push:
    # Every commit to master runs it: the run does nothing if the version of
    # the portal is already released here. A branch is not enough — the release
    # has to be published from master.
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "The version of the portal to build (empty — the latest one)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: wg-portal-release
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Find the version of the portal
        id: portal
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              https://api.github.com/repos/h44z/wg-portal/releases/latest | jq -r .tag_name)
          fi
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "no release of the portal found" >&2
            exit 1
          fi
          echo "the version of the portal: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is already released
        id: state
        run: |
          set -euo pipefail
          version="${{ steps.portal.outputs.version }}"
          # The tag of a release here is the version of the portal and the
          # revision of the packaging: the three first numbers of it are the
          # ones of the portal.
          latest=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | jq -r .tag_name || true)
          echo "the latest release here: ${latest:-none}"
          # The tag of a release is the version of the package, with or
          # without the "v": the three first numbers of it are the ones of the
          # portal.
          latest=${latest#v}
          if [ "${latest%.*}" = "${version#v}" ]; then
            echo "the version $version is already released here — nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the secret key of the feed
        # The package and the index of the feed are signed with it: apk
        # installs nothing whose signature it cannot check.
        if: steps.state.outputs.build == 'true'
        env:
          SECRET_KEY: ${{ secrets.APK_SECRET_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SECRET_KEY" > "$RUNNER_TEMP/secret.pem"
          chmod 600 "$RUNNER_TEMP/secret.pem"

      - name: Build the package and the index of the feed
        if: steps.state.outputs.build == 'true'
        run: |
          set -euo pipefail
          make dist VER="${{ steps.portal.outputs.version }}" SECRET_KEY="$RUNNER_TEMP/secret.pem"
          make feed VER="${{ steps.portal.outputs.version }}" SECRET_KEY="$RUNNER_TEMP/secret.pem"

      - name: Check the signature of the feed
        # The signature of the index has to be made with the key whose public
        # half is in the repository — otherwise the router would not trust the
        # feed.
        if: steps.state.outputs.build == 'true'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh -v "$PWD/dist:/w" -v "$PWD/keys:/keys:ro" \
            "wg-portal-pkg:${{ steps.portal.outputs.version }}" \
            -c 'apk --keys-dir /keys adbdump /w/packages.adb | grep -q ": OK"'

      - name: Build the image of the check
        # The image bakes the package in, so it is built after it — and it is
        # built directly, without the make target: that target builds the
        # package again first, and the key of the feed is not given to it
        # here. The image carries exactly the package that is published.
        if: steps.state.outputs.build == 'true'
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -t "wg-portal-check:${{ steps.portal.outputs.version }}" -f Dockerfile .

      - name: Check the package in the emulated router
        id: check
        if: steps.state.outputs.build == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.portal.outputs.version }}"
          # The check needs a tun device: the guest talks to the host through
          # it, and the feeds of the packages come over it. A runner without
          # the device cannot make the check at all — the release is published
          # anyway, and the notes of it say that the check was not made.
          if [ ! -e /dev/net/tun ]; then
            echo "the runner has no tun device: the check of the package is not made" >&2
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker run --rm --device /dev/net/tun --cap-add NET_ADMIN --cap-add NET_RAW \
            "wg-portal-check:$version" wireguard
          echo "mode=wireguard" >> "$GITHUB_OUTPUT"

      - name: Write the notes of the release
        if: steps.state.outputs.build == 'true'
        run: |
          set -euo pipefail
          apk=$(basename "$(ls dist/wg-portal-*.apk)")
          orig=$(stat -c %s dist/wg-portal.orig)
          packed=$(stat -c %s dist/wg-portal.packed)
          version=$(basename "$apk" .apk)
          version=${version#wg-portal-}
          {
            echo "The package of the portal for the router of the LAN: RouteRich AX3000 v1"
            echo "(\`mediatek/filogic\`, \`aarch64_cortex-a53\`), kernel 6.12.112."
            echo
            echo "The version of the package is four numbers: the three of the version of the"
            echo "portal and the fourth one is the revision of the packaging."
            echo
            echo '```sh'
            echo "apk add --allow-untrusted https://github.com/nhths/wg-portal-openwrt/releases/latest/download/$apk"
            echo '```'
            echo
            echo "The name of the asset carries the version, so the command gives the current"
            echo "version — running it again updates the package. The package is signed, though:"
            echo "the key of the project has to be trusted first — see the feed below."
            echo
            echo "### The feed"
            echo
            echo "The release carries also the index of the feed (\`packages.adb\`) and the public"
            echo "key of it (\`wg-portal.pem\`). With it the router installs and updates the"
            echo "package by name:"
            echo
            echo '```sh'
            echo "mkdir -p /etc/apk/keys"
            echo "wget -O /etc/apk/keys/wg-portal.pem https://github.com/nhths/wg-portal-openwrt/releases/latest/download/wg-portal.pem"
            echo "echo 'https://github.com/nhths/wg-portal-openwrt/releases/latest/download/packages.adb' >> /etc/apk/repositories.d/customfeeds.list"
            echo "apk update"
            echo "apk add wg-portal"
            echo '```'
            echo
            echo "The index is signed with the key of the project, an EC key of the curve"
            echo "P-256. Its id — the fingerprint of it — is"
            echo "\`fae55c35045ee540348110e6d6487953\`; the sha256 of the public key is"
            echo "\`c3f7c3d1651cd5d741245952d7fd533289532acff782235f1ec29184b71a9443\`."
            echo
            echo "The dependency of the package, the WireGuard kernel module, apk pulls in"
            echo "itself — from the feeds of the firmware, so the router needs the internet."
            echo "The package carries no configuration: write"
            echo "\`/etc/wg-portal/config.yaml\` and start the service."
            echo
            echo "| file | bytes |"
            echo "|---|---|"
            echo "| original | $orig |"
            echo "| packed (UPX --best --lzma) | $packed |"
            echo
            if [ "${{ steps.check.outputs.mode }}" = wireguard ]; then
              echo "Checked in the emulated OpenWrt: apk installs the package with the module,"
              echo "the portal answers and a WireGuard tunnel through it works."
            else
              echo "Not checked in the emulated OpenWrt: the runner that built this release had"
              echo "no tun device, and the check needs it."
            fi
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        if: steps.state.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=$(ls dist/wg-portal-*.apk)
          version=$(basename "$apk" .apk)
          version=${version#wg-portal-}
          # The feed: the index of the packages and the public key of it. apk
          # takes them from the directory of the url of the feed, so the names
          # of them are fixed.
          gh release create "$version" "$apk" dist/packages.adb dist/wg-portal.pem \
            --title "wg-portal $version for OpenWrt (aarch64_cortex-a53)" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Keep the package as an artifact of the run
        if: steps.state.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wg-portal-${{ steps.portal.outputs.version }}
          path: |
            dist/*.apk
            dist/packages.adb
            dist/wg-portal.pem

      - name: The summary
        run: |
          {
            echo "### wg-portal release"
            echo
            echo "- the version of the portal: ${{ steps.portal.outputs.version }}"
            echo "- built and published: ${{ steps.state.outputs.build }}"
          } >> "$GITHUB_STEP_SUMMARY"

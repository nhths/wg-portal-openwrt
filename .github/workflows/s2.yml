# The release of the .ipk package for wg-portal.
#
# Every two weeks the workflow looks for a new release of the portal
# (h44z/wg-portal). If there is one, it builds the package for the router
# (the binary packed with UPX), checks it in the emulated OpenWrt — the
# package is installed there and a real WireGuard tunnel is made through it —
# and publishes the .ipk as a release of this repository.
#
# The state of the workflow is the release itself: if the version of the
# portal is already released here, the run does nothing.
#
# The workflow runs the code of this repository, so the GitHub copy of the
# project is the one the Actions run in.
name: wg-portal release

on:
  schedule:
    # The 1st and the 15th of the month, 06:17 UTC. GitHub runs the scheduled
    # workflows with a delay, and the top of the hour is crowded.
    - cron: "17 6 1,15 * *"
  workflow_dispatch:
    inputs:
      version:
        description: "The version of the portal to build (empty — the latest one)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: wg-portal-release
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Check whether the version is already released
        id: state
        run: |
          set -euo pipefail
          version="${{ steps.portal.outputs.version }}"
          latest=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | jq -r .tag_name || true)
          echo "the latest release here: ${latest:-none}"
          if [ "$latest" = "$version" ] || gh release view "$version" >/dev/null 2>&1; then
            echo "the version $version is already released here — nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the package and the image of the check
        # The image bakes the package in, so it is built after it.
        if: steps.state.outputs.build == 'true'
        run: make image VER="${{ steps.portal.outputs.version }}"

      - name: Check the package in the emulated router
        if: steps.state.outputs.build == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.portal.outputs.version }}"
          docker run --rm --device /dev/net/tun --cap-add NET_ADMIN \
            "wg-portal-check:$version"

      - name: Write the notes of the release
        if: steps.state.outputs.build == 'true'
        run: |
          set -euo pipefail
          ipk=$(ls dist/wg-portal_*.ipk)
          orig=$(stat -c %s dist/wg-portal.orig)
          packed=$(stat -c %s dist/wg-portal.packed)
          {
            echo "The package of the portal for the router of the LAN: RouteRich AX3000 v1"
            echo "(\`mediatek/filogic\`, \`aarch64_cortex-a53\`), kernel 6.6.144."
            echo
            echo '```sh'
            echo "opkg install $(basename "$ipk")"
            echo '```'
            echo
            echo "The dependency of the package, the WireGuard kernel module, opkg pulls in"
            echo "itself. The package carries no configuration: write"
            echo "\`/etc/wg-portal/config.yaml\` and start the service."
            echo
            echo "| file | bytes |"
            echo "|---|---|"
            echo "| original | $orig |"
            echo "| packed (UPX --best --lzma) | $packed |"
            echo
            echo "Checked in the emulated OpenWrt: opkg installs the package with the module,"
            echo "the portal answers and a WireGuard tunnel through it works."
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        if: steps.state.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.portal.outputs.version }}"
          ipk=$(ls dist/wg-portal_*.ipk)
          gh release create "$version" "$ipk" \
            --title "wg-portal $version for OpenWrt (aarch64_cortex-a53)" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Keep the package as an artifact of the run
        if: steps.state.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wg-portal-${{ steps.portal.outputs.version }}
          path: dist/*.ipk

      - name: The summary
        run: |
          {
            echo "### wg-portal release"
            echo
            echo "- the version of the portal: ${{ steps.portal.outputs.version }}"
            echo "- built and published: ${{ steps.state.outputs.build }}"
          } >> "$GITHUB_STEP_SUMMARY"


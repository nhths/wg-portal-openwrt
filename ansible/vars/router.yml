---
# The ports and the addresses of the LAN router. Every one of them is
# overridden on the command line:
#
#   ansible-playbook ansible/router.yml -e wireguard_port=62820
#   ansible-playbook ansible/postinstall.yml -e tunnel_address=172.1.0.1/24

portal_web_port: 8888
wireguard_port: 51820

# The address of the router in the tunnel and the network of the peers.
tunnel_address: 172.1.0.1/24
tunnel_network: 172.1.0.0/24

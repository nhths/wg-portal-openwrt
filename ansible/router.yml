---
# The feed of the portal on the LAN router and its service.
#
#   ansible-galaxy collection install -r ansible/requirements.yml
#   ansible-playbook ansible/router.yml -e router_address=192.168.0.1
#
# The interface of the tunnel and the peers are not here: the portal creates
# them itself, from its web interface. The firewall of the tunnel is the
# second half of the setup — `ansible/postinstall.yml` — because it needs the
# address of the interface, and the portal is the one that writes it.

- name: Register the router
  hosts: localhost
  gather_facts: false
  vars:
    router_address: 192.168.0.1
    router_user: root
    router_ssh_key: ""
  tasks:
    - name: Add the router to the inventory
      ansible.builtin.add_host:
        name: router
        ansible_host: "{{ router_address }}"
        ansible_user: "{{ router_user }}"
        ansible_ssh_private_key_file: "{{ router_ssh_key if router_ssh_key else omit }}"
        # dropbear drops a session that gets nothing for 300 seconds.
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=accept-new
          -o ServerAliveInterval=30
          -o ServerAliveCountMax=6
      when: "'router' not in (groups['all'] | default([]))"

- name: Install the feed of the portal on the router
  hosts: router
  gather_facts: false
  vars:
    feed_url: https://github.com/nhths/wg-portal-openwrt/releases/latest/download
    feed_key_url: "{{ feed_url }}/wg-portal.pem"
    # The sha256 of the public key of the feed. The key itself is checked by
    # apk when it checks the signature of the index of the feed — this check
    # is about the key being the one of the project and not about the
    # signature.
    feed_key_sha256: c3f7c3d1651cd5d741245952d7fd533289532acff782235f1ec29184b71a9443
  tasks:
    - name: Fetch the public key of the feed
      ansible.builtin.uri:
        url: "{{ feed_key_url }}"
        return_content: true
        follow_redirects: all
      delegate_to: localhost
      register: feed_key

    - name: Fail when the key is not the one of the project
      ansible.builtin.assert:
        that:
          - feed_key.content | hash('sha256') == feed_key_sha256
        fail_msg: >-
          the sha256 of the key of the feed is
          {{ feed_key.content | hash('sha256') }} — it has to be
          {{ feed_key_sha256 }}, the key is not the one of the project
        quiet: true

    - name: Trust the feed of the portal and point apk at it
      # The feed is declared in the file OpenWrt keeps across a system
      # upgrade.
      community.openwrt.apk_feed:
        url: "{{ feed_url }}/packages.adb"
        key: "{{ feed_key.content }}"
        key_name: wg-portal.pem

    - name: Install the portal from the feed
      # `state: latest` installs the portal when it is missing and upgrades it
      # when the feed has a newer version — `apk add` alone leaves a package
      # that is installed already alone.
      community.openwrt.apk:
        name: wg-portal
        state: latest
        update_cache: true
      register: router_install

    - name: Report the state of the portal and of its dependency
      community.openwrt.command:
        cmd: "apk info wg-portal kmod-wireguard"
      register: router_state
      changed_when: false

    - name: Report the state of the portal and of its dependency
      ansible.builtin.debug:
        msg: "{{ router_state.stdout }}"

- name: Configure the portal on the router
  hosts: router
  gather_facts: false
  vars_files:
    - vars/router.yml
  vars:
    portal_admin_password: ""
    portal_web_address: 0.0.0.0
  tasks:
    - name: Create the directory of the portal
      community.openwrt.file:
        path: /etc/wg-portal
        state: directory
        mode: "0700"

    - name: Check whether the portal is configured
      community.openwrt.stat:
        path: /etc/wg-portal/config.yaml
      register: portal_configured

    - name: Make the password of the administrator
      community.openwrt.command:
        cmd: >-
          [ -n {{ portal_admin_password | quote }} ] && echo {{ portal_admin_password | quote }}
          || (head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
        uses_shell: true
      register: portal_password
      changed_when: false
      when: not portal_configured.stat.exists

    - name: Write the configuration of the portal
      community.openwrt.copy:
        content: |
          core:
            admin_password: {{ portal_password.stdout | trim }}
          web:
            listening_address: {{ portal_web_address }}:{{ portal_web_port }}
          database:
            dsn: /etc/wg-portal/wg.db
        dest: /etc/wg-portal/config.yaml
        mode: "0600"
      when: not portal_configured.stat.exists

    - name: Report the password of the administrator
      ansible.builtin.debug:
        msg: >-
          the password of the administrator of the portal:
          {{ portal_password.stdout | trim }}
      when: not portal_configured.stat.exists

    - name: Read the configuration of the portal
      community.openwrt.slurp:
        src: /etc/wg-portal/config.yaml
      register: portal_config

    - name: Take the port of the web interface of the portal
      # The lines are taken with the method of the string: Jinja does not
      # decode the escapes of a literal, so `split('\n')` cuts the text by the
      # two characters of the escape and not by the line.
      ansible.builtin.set_fact:
        portal_port: >-
          {{ (portal_config.content | b64decode).splitlines()
              | map('trim') | select('search', 'listening_address:') | list | first
              | default('', true) | split(':') | last | trim
              | default(portal_web_port | string, true) }}

    - name: Enable and start the portal
      # The postinst of the package only enables the service: an upgrade of
      # the package leaves the old binary running until it is restarted.
      community.openwrt.service:
        name: wg-portal
        state: "{{ 'restarted' if router_install.changed | default(false) else 'started' }}"
        enabled: true

    - name: Wait for the portal to answer
      community.openwrt.command:
        cmd: >-
          wget -q -O /dev/null http://127.0.0.1:{{ portal_port }}/api/v0/auth/providers
      register: portal_http
      changed_when: false
      until: portal_http.rc == 0
      retries: 30
      delay: 2

    - name: Report the state of the portal
      community.openwrt.command:
        cmd: "logread | tail -20; netstat -ltn"
        uses_shell: true
      register: portal_state
      changed_when: false

    - name: Gather the installed packages once more
      community.openwrt.command:
        cmd: "apk info wg-portal"
      register: portal_version
      changed_when: false

    - name: Report the state of the portal
      ansible.builtin.debug:
        msg: "{{ portal_state.stdout }}{{ portal_version.stdout }}"

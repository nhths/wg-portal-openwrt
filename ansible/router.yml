---
# The feed of the portal on the LAN router, its firewall and its service.
#
#   ansible-galaxy collection install -r ansible/requirements.yml
#   ansible-playbook ansible/router.yml -e router_address=192.168.0.1
#
# The interface of the tunnel and the peers are not here: the portal creates
# them itself, from its web interface.

- name: Register the router
  hosts: localhost
  gather_facts: false
  vars:
    router_address: 192.168.0.1
    router_user: root
    router_ssh_key: ""
  tasks:
    - name: Add the router to the inventory
      ansible.builtin.add_host:
        name: router
        ansible_host: "{{ router_address }}"
        ansible_user: "{{ router_user }}"
        ansible_ssh_private_key_file: "{{ router_ssh_key if router_ssh_key else omit }}"
        # dropbear drops a session that gets nothing for 300 seconds.
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=accept-new
          -o ServerAliveInterval=30
          -o ServerAliveCountMax=6
      when: "'router' not in (ansible_inventory_hostnames | default({}))"

- name: Install the feed of the portal on the router
  hosts: router
  gather_facts: false
  vars:
    feed_url: https://github.com/nhths/wg-portal-openwrt/releases/latest/download
    feed_key_url: "{{ feed_url }}/wg-portal.pub"
    feed_fingerprint: 4aae624e9d888fea
  tasks:
    - name: Fetch the public key of the feed
      ansible.builtin.uri:
        url: "{{ feed_key_url }}"
        return_content: true
        follow_redirects: all
      delegate_to: localhost
      register: feed_key

    - name: Write the key to the router
      community.openwrt.copy:
        content: "{{ feed_key.content }}"
        dest: /tmp/wg-portal.pub
        mode: "0644"

    - name: Read the fingerprint of the key
      community.openwrt.command:
        cmd: "usign -F -p /tmp/wg-portal.pub"
      register: router_fingerprint
      changed_when: false

    - name: Report the fingerprint of the key
      ansible.builtin.debug:
        msg: "{{ router_fingerprint.stdout }}"

    - name: Fail when the key is not the one of the project
      ansible.builtin.assert:
        that:
          - feed_fingerprint in router_fingerprint.stdout
        fail_msg: >-
          the fingerprint of the key is not {{ feed_fingerprint }} —
          the key is not the one of the project
        quiet: true

    - name: Trust the public key of the feed
      community.openwrt.command:
        cmd: "opkg-key add /tmp/wg-portal.pub"
      changed_when: false

    - name: Point opkg at the feed of the portal
      # The firmware ships customfeeds.conf full of null bytes, and opkg does
      # not read such a file. "src/gz" is the way the feeds of the firmware
      # are declared: opkg takes the compressed index then, and LuCI needs it
      # as well — it reads the indexes with "gzip -cd" and skips the plain
      # ones.
      community.openwrt.command:
        cmd: >-
          [ -f /etc/opkg/customfeeds.conf ]
          && tr -d "\000" < /etc/opkg/customfeeds.conf > /tmp/customfeeds.conf
          || : > /tmp/customfeeds.conf;
          grep -v "^src.* wgp {{ feed_url }}$" /tmp/customfeeds.conf
          > /tmp/customfeeds.new || :;
          echo "src/gz wgp {{ feed_url }}" >> /tmp/customfeeds.new;
          cat /tmp/customfeeds.new > /etc/opkg/customfeeds.conf;
          rm -f /tmp/customfeeds.conf /tmp/customfeeds.new
        uses_shell: true
      changed_when: false

    - name: Install the portal from the feed
      community.openwrt.opkg:
        name: wg-portal
        state: present
        update_cache: true
      register: router_install

    - name: Report the state of the portal and of its dependency
      community.openwrt.command:
        cmd: "opkg status wg-portal kmod-wireguard"
      register: router_state
      changed_when: false

    - name: Report the state of the portal and of its dependency
      ansible.builtin.debug:
        msg: "{{ router_state.stdout }}"

- name: Configure the portal on the router
  hosts: router
  gather_facts: false
  vars_files:
    - vars/router.yml
  vars:
    portal_admin_password: ""
    portal_web_address: 0.0.0.0
    redirect_fields: [name, dest, dest_ip, dest_port, src_dport]
    tunnel_zone: wg
    tunnel_interface: wg0
    tunnel_config_path: /etc/wireguard
  tasks:
    - name: Create the directory of the portal
      community.openwrt.file:
        path: /etc/wg-portal
        state: directory
        mode: "0700"

    - name: Check whether the portal is configured
      community.openwrt.stat:
        path: /etc/wg-portal/config.yaml
      register: portal_configured

    - name: Make the password of the administrator
      community.openwrt.command:
        cmd: >-
          [ -n {{ portal_admin_password | quote }} ] && echo {{ portal_admin_password | quote }}
          || (head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
        uses_shell: true
      register: portal_password
      changed_when: false
      when: not portal_configured.stat.exists

    - name: Write the configuration of the portal
      community.openwrt.copy:
        content: |
          core:
            admin_password: {{ portal_password.stdout | trim }}
          web:
            listening_address: {{ portal_web_address }}:{{ portal_web_port }}
          database:
            dsn: /etc/wg-portal/wg.db
        dest: /etc/wg-portal/config.yaml
        mode: "0600"
      when: not portal_configured.stat.exists

    - name: Report the password of the administrator
      ansible.builtin.debug:
        msg: >-
          the password of the administrator of the portal:
          {{ portal_password.stdout | trim }}
      when: not portal_configured.stat.exists

    - name: Read the port of the web interface of the portal
      community.openwrt.command:
        cmd: >-
          sed -n 's/^[[:space:]]*listening_address:[[:space:]]*//p'
          /etc/wg-portal/config.yaml
      register: portal_listening
      changed_when: false

    - name: Take the port of the web interface of the portal
      ansible.builtin.set_fact:
        portal_port: >-
          {{ (portal_listening.stdout | trim).split(':')[-1] | trim
          | default(portal_web_port | string, true) }}

    - name: Read the port of the tunnel
      community.openwrt.command:
        cmd: >-
          sed -n 's/^[[:space:]]*ListenPort[[:space:]]*=[[:space:]]*//p'
          {{ tunnel_config_path }}/{{ tunnel_interface }}.conf 2>/dev/null || true
        uses_shell: true
      register: tunnel_listen
      changed_when: false

    - name: Read the network of the tunnel
      community.openwrt.command:
        cmd: >-
          sed -n 's/^[[:space:]]*Address[[:space:]]*=[[:space:]]*//p'
          {{ tunnel_config_path }}/{{ tunnel_interface }}.conf 2>/dev/null || true
        uses_shell: true
      register: tunnel_address
      changed_when: false

    - name: Take the port and the network of the tunnel
      ansible.builtin.set_fact:
        tunnel_port: "{{ (tunnel_listen.stdout | trim) | default('', true) }}"
        tunnel_network: "{{ (tunnel_address.stdout | trim) | default('', true) }}"

    - name: Check that the port of the tunnel is the port of the play
      ansible.builtin.assert:
        that:
          - tunnel_port == "" or tunnel_port == wireguard_port | string
        fail_msg: >-
          the tunnel listens on the port {{ tunnel_port }}, and the rule of
          the firewall is made for the port {{ wireguard_port }} — run the
          play with -e wireguard_port={{ tunnel_port }}
        quiet: true

    - name: Report the port and the network of the tunnel
      ansible.builtin.debug:
        msg: >-
          the tunnel listens on the port {{ tunnel_port | default('unknown', true) }},
          the network of it is {{ tunnel_network | default('unknown', true) }}

    - name: Check that the network of the tunnel is known
      ansible.builtin.assert:
        that:
          - tunnel_network != ""
        fail_msg: >-
          the network of the tunnel is not in the configuration of its
          interface — the firewall cannot be told where the peers are
        quiet: true

    - name: Put the tunnel into the firewall
      # The zone names the device, not a network: the interface of the tunnel
      # is created by the portal itself and is not in /etc/config/network.
      community.openwrt.uci:
        autocommit: false
        operations:
          - command: ensure
            config: firewall
            type: zone
            name: "{{ tunnel_zone }}"
            find:
              name: "{{ tunnel_zone }}"
            value:
              input: ACCEPT
              output: ACCEPT
              forward: ACCEPT
          - command: add_list
            key: "firewall.{{ tunnel_zone }}.device"
            value: "{{ tunnel_interface }}"
            unique: true

    - name: Tell the firewall the network of the tunnel
      # The zone names the device, not a network: the interface of the tunnel
      # is created by the portal itself and is not in /etc/config/network.
      # Without the network fw4 does not know the addresses of the peers.
      community.openwrt.uci:
        autocommit: false
        operations:
          - command: set
            key: "firewall.{{ tunnel_zone }}.subnet"
            value: "{{ tunnel_network }}"

    - name: Let the tunnel and the lan talk to each other
      community.openwrt.uci:
        autocommit: false
        operations:
          - command: ensure
            config: firewall
            type: forwarding
            name: "{{ item.section }}"
            find:
              src: "{{ item.src }}"
              dest: "{{ item.dest }}"
            value:
              src: "{{ item.src }}"
              dest: "{{ item.dest }}"
      loop:
        - section: wg_to_lan
          src: wg
          dest: lan
        - section: wg_to_wan
          src: wg
          dest: wan
        - section: lan_to_wg
          src: lan
          dest: wg

    - name: Let the peers in from the internet
      community.openwrt.uci:
        autocommit: false
        operations:
          - command: ensure
            config: firewall
            type: rule
            name: wg_incoming
            find:
              name: Allow-WireGuard
            value:
              name: Allow-WireGuard
              src: wan
              proto: udp
              dest_port: "{{ wireguard_port }}"
              target: ACCEPT

    - name: Find the redirects of the wan zone
      community.openwrt.uci:
        command: find_all
        config: firewall
        type: redirect
        find:
          src: wan
      register: wan_redirects
      changed_when: false
      failed_when: false

    - name: Read the redirects of the wan zone
      # "uci get" of a section returns the type of it, not its options, so the
      # options of every redirect are read one by one.
      community.openwrt.uci:
        command: get
        config: firewall
        section: "{{ item.0 }}"
        option: "{{ item.1 }}"
      register: redirect_options
      loop: >-
        {{ wan_redirects.result_list | default([])
        | product(redirect_fields) | list }}
      changed_when: false
      failed_when: false

    - name: Take the redirects of the wan zone
      ansible.builtin.set_fact:
        public_redirects: "{{ public_redirects | default([]) + [dict(redirect_fields | zip(item))] }}"
      loop: >-
        {{ redirect_options.results | default([]) | map(attribute='result') | list
        | batch(redirect_fields | length) | list }}

    - name: Let the tunnel reach the services of the public address
      # fw4 builds the rules of the hairpin on its own: the traffic of the lan
      # to the public address of the router is redirected to the gate. The zone
      # of the tunnel wants the same, and the reflection of the redirect gives
      # it to the zone of the tunnel. A redirect of the zone of the tunnel on
      # its own would match by the port alone, and then every request of the
      # peers would go to the gate.
      community.openwrt.uci:
        autocommit: false
        operations:
          - command: ensure
            config: firewall
            type: redirect
            find:
              name: "{{ item.name }}"
            value:
              reflection_zone: "{{ item.dest }} {{ tunnel_zone }}"
      loop: "{{ public_redirects | default([]) }}"
      loop_control:
        label: "{{ item.name | default('?') }}"

    - name: Take the redirects of the tunnel away
      # The older version of the play made a redirect of its own for the zone
      # of the tunnel, and that one matched by the port alone.
      community.openwrt.uci:
        autocommit: false
        command: delete
        key: "firewall.{{ item.name }}_{{ tunnel_zone }}"
      loop: "{{ public_redirects | default([]) }}"
      loop_control:
        label: "{{ item.name | default('?') }}"
      failed_when: false

    - name: Masquerade the traffic that leaves to the internet
      # The zone of the wan masquerades the traffic that leaves through it. A
      # rule of its own for the tunnel would masquerade the traffic the wrong
      # way round: fw4 puts it into the chain of the zone of the source.
      community.openwrt.uci:
        autocommit: false
        operations:
          - command: ensure
            config: firewall
            type: zone
            find:
              name: wan
            value:
              masq: "1"

    - name: Take the masquerade of the tunnel away
      community.openwrt.uci:
        command: delete
        key: firewall.wg_masquerade

    - name: Write the firewall
      community.openwrt.uci:
        command: commit
        config: firewall

    - name: Reload the firewall
      community.openwrt.service:
        name: firewall
        state: reloaded

    - name: Look for the proxy of the router
      community.openwrt.command:
        cmd: "test -f /etc/init.d/podkop && test -f /etc/config/podkop"
        uses_shell: true
      register: podkop_present
      changed_when: false
      failed_when: false

    - name: Read the interfaces of the proxy of the router
      # The dns of the router answers with the fake addresses of the proxy, and
      # the proxy intercepts the traffic to them. The tunnel has to be in the
      # list of the interfaces of the proxy as well, or the traffic of the
      # peers to those addresses is not intercepted.
      community.openwrt.uci:
        command: get
        config: podkop
        section: settings
        option: source_network_interfaces
      register: podkop_interfaces
      changed_when: false
      failed_when: false
      when: podkop_present.rc == 0

    - name: Let the tunnel through the proxy of the router
      community.openwrt.uci:
        autocommit: true
        command: set
        config: podkop
        section: settings
        option: source_network_interfaces
        value: >-
          {{ (podkop_interfaces.result | default('', true)).split(' ')
          | select('ne', '') | list | union([tunnel_interface]) | join(' ') }}
      notify: Restart the proxy of the router
      when: podkop_present.rc == 0

    - name: Enable and start the portal
      # The postinst of the package only enables the service: an upgrade of
      # the package leaves the old binary running until it is restarted.
      community.openwrt.service:
        name: wg-portal
        state: "{{ 'restarted' if router_install.changed | default(false) else 'started' }}"
        enabled: true

    - name: Wait for the portal to answer
      community.openwrt.command:
        cmd: >-
          wget -q -O /dev/null http://127.0.0.1:{{ portal_port }}/api/v0/auth/providers
      register: portal_http
      changed_when: false
      until: portal_http.rc == 0
      retries: 30
      delay: 2

    - name: Report the state of the portal
      community.openwrt.command:
        cmd: "logread | tail -20; netstat -ltn; opkg status wg-portal"
        uses_shell: true
      register: portal_state
      changed_when: false

    - name: Report the state of the portal
      ansible.builtin.debug:
        msg: "{{ portal_state.stdout }}"

  handlers:
    - name: Restart the proxy of the router
      community.openwrt.service:
        name: podkop
        state: restarted

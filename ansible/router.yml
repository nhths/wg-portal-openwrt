---
# The feed of the portal on the LAN router.
#
# The play is self-contained: it needs nothing but Ansible and the access to
# the router. The public key of the feed it fetches itself, the address of
# the router is a variable of the play, and the inventory is not needed — the
# router is registered here. If the inventory has a host named "router",
# that one is used as it is.
#
#   ansible-playbook ansible/router.yml
#   ansible-playbook ansible/router.yml -e router_address=192.168.0.1
#
# Only the modules of Ansible itself are used. The modules of the
# community.openwrt collection would need a collection that is not in Ansible,
# and this play has to work on a machine where nothing was installed for it.
#
# The router is an OpenWrt on dropbear: it has no Python, so the commands
# run through the raw module, which needs no interpreter on the device.
#
# The configuration of the portal, the zone of the firewall for the tunnel and
# the service are here as well: the play writes the configuration of the
# portal, opens the tunnel in the firewall and starts the service. The
# interface of the tunnel and the peers are not: the portal creates them
# itself, from its web interface.
#
# The port of the tunnel is a variable of the play: the standard port of
# WireGuard by default, another one with -e wireguard_port=... The play
# checks it against the port the portal really listens on — the portal
# writes the configuration of the interface it made — and stops when they
# are not the same.

- name: Register the router
  hosts: localhost
  gather_facts: false
  vars:
    # The address of the LAN router. The inventory of the serverside repo
    # owns the value, but the play has to work without any inventory — this
    # is the default, and it is overridden with -e router_address=...
    router_address: 192.168.0.1
    router_user: root
    # The private key of the router. Empty means the default one of the
    # machine the play runs on.
    router_ssh_key: ""
  tasks:
    - name: Add the router to the inventory
      ansible.builtin.add_host:
        name: router
        ansible_host: "{{ router_address }}"
        ansible_user: "{{ router_user }}"
        ansible_ssh_private_key_file: "{{ router_ssh_key if router_ssh_key else omit }}"
        # dropbear drops a session that gets nothing for 300 seconds, and it
        # counts the packets it reads: the keepalive of the client is what
        # keeps the session alive while opkg downloads the package.
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=accept-new
          -o ServerAliveInterval=30
          -o ServerAliveCountMax=6
      # The variable of the inventory is not there when no inventory was
      # parsed at all — the play has to work without one.
      when: "'router' not in (ansible_inventory_hostnames | default({}))"

- name: Install the feed of the portal on the router
  hosts: router
  gather_facts: false
  vars:
    # The feed of the portal: the directory of the download of the last
    # release. opkg takes the index and the packages of the feed from it.
    feed_url: https://github.com/nhths/wg-portal-openwrt/releases/latest/download
    # The public key of the feed, in the release next to the index.
    feed_key_url: "{{ feed_url }}/wg-portal.pub"
    # The fingerprint of the key of the feed. It is the one of the key in
    # keys/wg-portal.pub, and the README has it as well.
    feed_fingerprint: 4aae624e9d888fea
  tasks:
    - name: Fetch the public key of the feed
      # The key is fetched by the machine the play runs on, not by the router:
      # the router has no Python, and the module of the url needs one.
      ansible.builtin.uri:
        url: "{{ feed_key_url }}"
        return_content: true
        follow_redirects: all
      delegate_to: localhost
      register: feed_key

    - name: Write the key to the router
      # The copy module of Ansible needs Python on the device, and the router
      # has none — the file is written through the shell instead.
      ansible.builtin.raw: |
        printf '%s\n' {{ feed_key.content | trim | quote }} > /tmp/wg-portal.pub
      changed_when: true

    - name: Read the fingerprint of the key
      ansible.builtin.raw: "usign -F -p /tmp/wg-portal.pub"
      register: router_fingerprint
      changed_when: false

    - name: Report the fingerprint of the key
      ansible.builtin.debug:
        msg: "{{ router_fingerprint.stdout }}"

    - name: Fail when the key is not the one of the project
      # The key is trusted only when it is the one of the project: the
      # fingerprint of it is in the README and in AGENTS.md.
      ansible.builtin.assert:
        that:
          - feed_fingerprint in router_fingerprint.stdout
        fail_msg: >-
          the fingerprint of the key is not {{ feed_fingerprint }} —
          the key is not the one of the project
        quiet: true

    - name: Trust the public key of the feed
      # opkg-key puts the key into /etc/opkg/keys under its fingerprint, and
      # opkg checks the signature of the index of the feed against the keys
      # it trusts.
      ansible.builtin.raw: "opkg-key add /tmp/wg-portal.pub"
      changed_when: false

    - name: Point opkg at the feed of the portal
      # The firmware of the router ships /etc/opkg/customfeeds.conf full of
      # null bytes, and opkg does not read such a file: the feed of the
      # portal stays invisible to it, and opkg answers "Cannot install
      # package". The nulls are dropped, the lines that are left are kept,
      # and the feed is added to them.
      #
      # The source is declared as "src/gz", the way the feeds of the firmware
      # are declared: opkg takes the index of it compressed then, and stores
      # it compressed. LuCI reads the indexes of the feeds with "gzip -cd",
      # and it skips the ones that are not compressed — with a plain index
      # the portal shows up in the list of the installed packages without a
      # size and without a description.
      ansible.builtin.raw: >-
        [ -f /etc/opkg/customfeeds.conf ]
        && tr -d "\000" < /etc/opkg/customfeeds.conf > /tmp/customfeeds.conf
        || : > /tmp/customfeeds.conf;
        grep -v "^src.* wgp {{ feed_url }}$" /tmp/customfeeds.conf
        > /tmp/customfeeds.new || :;
        echo "src/gz wgp {{ feed_url }}" >> /tmp/customfeeds.new;
        cat /tmp/customfeeds.new > /etc/opkg/customfeeds.conf;
        rm -f /tmp/customfeeds.conf /tmp/customfeeds.new
      changed_when: false

    - name: Update the lists of opkg
      ansible.builtin.raw: "opkg update"
      register: router_update
      changed_when: false
      until: router_update.rc == 0
      retries: 15
      delay: 2

    - name: Report the update of the lists
      ansible.builtin.debug:
        msg: "{{ router_update.stdout }}"

    - name: Check whether the portal is installed
      ansible.builtin.raw: "opkg status wg-portal"
      register: router_status
      changed_when: false
      failed_when: false

    - name: Install the portal from the feed
      # A package that is not on the router yet is installed, a package that
      # is there is upgraded: opkg does not reinstall a package of the same
      # version, and the feed is what brings the next one by itself.
      ansible.builtin.raw: >-
        {{ 'opkg upgrade wg-portal' if 'Status:' in router_status.stdout
        else 'opkg install wg-portal' }}
      register: router_install
      changed_when: >-
        'Installing' in router_install.stdout or 'Upgrading' in router_install.stdout

    - name: Report the installation
      ansible.builtin.debug:
        msg: "{{ router_install.stdout }}"

    - name: Report the state of the portal and of its dependency
      ansible.builtin.raw: "opkg status wg-portal kmod-wireguard"
      register: router_state
      changed_when: false

    - name: Report the state of the portal and of its dependency
      ansible.builtin.debug:
        msg: "{{ router_state.stdout }}"

- name: Configure the portal on the router
  hosts: router
  gather_facts: false
  vars:
    # The password of the administrator of the portal. When it is empty, a
    # password is made — and printed at the end of the play — but only when
    # the configuration of the portal is written for the first time.
    portal_admin_password: ""
    # The address and the port of the web interface of the portal.
    portal_web_address: 0.0.0.0
    portal_web_port: 8888
    # The port of the WireGuard server. The rule of the firewall that lets
    # the peers in from the internet is made for it. The default is the
    # standard port of WireGuard — the portal may listen on another one,
    # and then the port is given with -e wireguard_port=...
    wireguard_port: 51820
    # The interface of the tunnel. The portal creates the interface by
    # itself, so the firewall only has to know the device of it.
    tunnel_interface: wg0
    # The directory of the configuration the portal writes for the interface
    # of the tunnel. It is the "advanced.config_storage_path" of the
    # configuration of the portal.
    tunnel_config_path: /etc/wireguard
  tasks:
    - name: Create the directory of the portal
      ansible.builtin.raw: "mkdir -p /etc/wg-portal && chmod 700 /etc/wg-portal"
      changed_when: true

    - name: Check whether the portal is configured
      ansible.builtin.raw: "test -f /etc/wg-portal/config.yaml"
      register: portal_configured
      changed_when: false
      failed_when: false

    - name: Make the password of the administrator
      # The password is made on the router: it never travels through the
      # machine the play runs on, unless it is given with -e.
      ansible.builtin.raw: >-
        [ -n {{ portal_admin_password | quote }} ] && echo {{ portal_admin_password | quote }}
        || (head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
      register: portal_password
      changed_when: false
      when: portal_configured.rc != 0

    - name: Write the configuration of the portal
      # The package carries no configuration, so the portal has none until
      # this file is written. The database is on the flash: /tmp is a tmpfs.
      # The configuration is written once — the portal owns it afterwards,
      # and a second run of the play does not change the password.
      ansible.builtin.raw: >-
        printf 'core:\n  admin_password: %s\nweb:\n  listening_address: %s:%s\ndatabase:\n  dsn: /etc/wg-portal/wg.db\n'
        {{ portal_password.stdout | trim | quote }}
        {{ portal_web_address | quote }} {{ portal_web_port | quote }}
        > /etc/wg-portal/config.yaml;
        chmod 600 /etc/wg-portal/config.yaml
      changed_when: true
      when: portal_configured.rc != 0

    - name: Report the password of the administrator
      # The password is printed once, when the configuration is written: there
      # is no other way to get it out of the router.
      ansible.builtin.debug:
        msg: >-
          the password of the administrator of the portal:
          {{ portal_password.stdout | trim }}
      when: portal_configured.rc != 0

    - name: Read the port of the web interface of the portal
      # The portal owns the configuration of itself, so the port of the web
      # interface is the one it writes there — not the one of this play.
      ansible.builtin.raw: >-
        sed -n 's/^[[:space:]]*listening_address:[[:space:]]*//p'
        /etc/wg-portal/config.yaml
      register: portal_listening
      changed_when: false

    - name: Take the port of the web interface of the portal
      ansible.builtin.set_fact:
        portal_port: >-
          {{ (portal_listening.stdout | trim).split(':')[-1] | trim
          | default(portal_web_port | string, true) }}

    - name: Read the port of the tunnel
      # The portal writes the configuration of the interface it made, and the
      # port of the tunnel is in it. There is no such file while the portal
      # has no interface yet.
      ansible.builtin.raw: >-
        sed -n 's/^[[:space:]]*ListenPort[[:space:]]*=[[:space:]]*//p'
        {{ tunnel_config_path }}/{{ tunnel_interface }}.conf 2>/dev/null || true
      register: tunnel_listen
      changed_when: false

    - name: Read the network of the tunnel
      ansible.builtin.raw: >-
        sed -n 's/^[[:space:]]*Address[[:space:]]*=[[:space:]]*//p'
        {{ tunnel_config_path }}/{{ tunnel_interface }}.conf 2>/dev/null || true
      register: tunnel_address
      changed_when: false

    - name: Take the port and the network of the tunnel
      ansible.builtin.set_fact:
        tunnel_port: "{{ (tunnel_listen.stdout | trim) | default('', true) }}"
        tunnel_network: "{{ (tunnel_address.stdout | trim) | default('', true) }}"

    - name: Check that the port of the tunnel is the port of the play
      # The rule of the firewall is made for the port of the variables of the
      # play, and the tunnel has to listen on it — otherwise the rule opens a
      # port nobody listens on and the peers cannot come in. The play stops
      # and says which port to give it.
      ansible.builtin.assert:
        that:
          - tunnel_port == "" or tunnel_port == wireguard_port | string
        fail_msg: >-
          the tunnel listens on the port {{ tunnel_port }}, and the rule of
          the firewall is made for the port {{ wireguard_port }} — run the
          play with -e wireguard_port={{ tunnel_port }}
        quiet: true

    - name: Report the port and the network of the tunnel
      ansible.builtin.debug:
        msg: >-
          the tunnel listens on the port {{ tunnel_port | default('unknown', true) }},
          the network of it is {{ tunnel_network | default('unknown', true) }}

    - name: Put the tunnel into the firewall
      # The traffic of the peers is not tracked by the connection tracking of
      # the firewall, so the default policy rejects it and the peer gets an
      # "unreachable" instead of the answer.
      #
      # The zone names the device, not a network: the interface of the tunnel
      # is created by the portal itself and is not in /etc/config/network, so
      # a network of that name would never match any traffic.
      ansible.builtin.raw: >-
        before="$(uci show firewall.wg 2>/dev/null)";
        uci -q get firewall.wg >/dev/null || uci set firewall.wg="zone";
        uci set firewall.wg.name="wg";
        uci set firewall.wg.input="ACCEPT";
        uci set firewall.wg.output="ACCEPT";
        uci set firewall.wg.forward="ACCEPT";
        uci -q del_list firewall.wg.device={{ tunnel_interface | quote }} || :;
        uci add_list firewall.wg.device={{ tunnel_interface | quote }};
        after="$(uci show firewall.wg 2>/dev/null)";
        [ "$before" = "$after" ] && echo unchanged || echo changed
      register: firewall_zone
      changed_when: "'changed' in firewall_zone.stdout"

    - name: Let the tunnel and the lan talk to each other
      # The peers of the portal reach the services of the lan and the internet
      # through the router, and the lan reaches the peers through the tunnel.
      ansible.builtin.raw: >-
        before="$(uci show firewall.{{ item.section }} 2>/dev/null)";
        uci set firewall.{{ item.section }}="forwarding" 2>/dev/null
        || (uci -q delete firewall.{{ item.section }};
        uci set firewall.{{ item.section }}="forwarding");
        uci set firewall.{{ item.section }}.src={{ item.src | quote }};
        uci set firewall.{{ item.section }}.dest={{ item.dest | quote }};
        after="$(uci show firewall.{{ item.section }} 2>/dev/null)";
        [ "$before" = "$after" ] && echo unchanged || echo changed
      loop:
        - section: wg_to_lan
          src: wg
          dest: lan
        - section: wg_to_wan
          src: wg
          dest: wan
        - section: lan_to_wg
          src: lan
          dest: wg
      register: firewall_forwarding
      changed_when: "'changed' in firewall_forwarding.stdout"

    - name: Let the peers in from the internet
      # The rule has no zone of the destination: it opens the port of the
      # WireGuard server on the router itself. The router is behind the
      # gateway of the LAN, so the port has to be forwarded there as well.
      ansible.builtin.raw: >-
        before="$(uci show firewall.wg_incoming 2>/dev/null)";
        uci set firewall.wg_incoming="rule" 2>/dev/null
        || (uci -q delete firewall.wg_incoming;
        uci set firewall.wg_incoming="rule");
        uci set firewall.wg_incoming.name="Allow-WireGuard";
        uci set firewall.wg_incoming.src="wan";
        uci set firewall.wg_incoming.proto="udp";
        uci set firewall.wg_incoming.dest_port={{ wireguard_port | quote }};
        uci set firewall.wg_incoming.target="ACCEPT";
        after="$(uci show firewall.wg_incoming 2>/dev/null)";
        [ "$before" = "$after" ] && echo unchanged || echo changed
      register: firewall_rule
      changed_when: "'changed' in firewall_rule.stdout"

    - name: Masquerade the traffic that leaves to the internet
      # The peers reach the internet through the router, and the router is
      # behind the gateway of the LAN: the addresses of the tunnel are not
      # routable outside of it, so the traffic has to be masqueraded on the
      # way out. In fw4 it is the zone of the wan that does it — the zone
      # masquerades the traffic that leaves through it.
      #
      # The zone is found by its name: the sections of the zones are
      # anonymous, and their numbers move.
      ansible.builtin.raw: >-
        section="$(uci show firewall | grep -E "^firewall\.[^.]+\.name='wan'$" | cut -d. -f2)";
        [ -n "$section" ] || exit 0;
        before="$(uci show firewall.$section)";
        uci set firewall.$section.masq='1';
        after="$(uci show firewall.$section)";
        [ "$before" = "$after" ] && echo unchanged || echo changed
      register: firewall_masq
      changed_when: "'changed' in firewall_masq.stdout"

    - name: Take the masquerade of the tunnel away
      # A rule of the firewall of its own for the tunnel masquerades the
      # traffic the wrong way round: fw4 puts it into the chain of the zone
      # of the source, and that chain is entered by the traffic that leaves
      # through the zone — so such a rule masquerades the traffic that goes
      # into the tunnel, not the traffic that comes out of it. The zone of
      # the wan masquerades the traffic on the way out, and that is enough.
      ansible.builtin.raw: "uci -q delete firewall.wg_masquerade"
      register: firewall_nat
      changed_when: firewall_nat.rc == 0

    - name: Write the firewall
      ansible.builtin.raw: "uci commit firewall"
      changed_when: true

    - name: Reload the firewall
      ansible.builtin.raw: "/etc/init.d/firewall reload"
      changed_when: false

    - name: Let the tunnel through the proxy of the router
      # The router has a transparent proxy on it (podkop), and the traffic of
      # the lan goes through it: the dns of the router answers with the fake
      # addresses of the proxy, and the proxy intercepts the traffic to them.
      # The tunnel has to be in the list of the interfaces of the proxy as
      # well — otherwise the peers get the same fake addresses, and their
      # traffic to them is not intercepted: it goes to the internet as it
      # is, and nobody answers it.
      #
      # The proxy is not on every router: the task does nothing where there
      # is none.
      ansible.builtin.raw: >-
        uci -q get podkop.settings.source_network_interfaces >/dev/null || exit 0;
        before="$(uci get podkop.settings.source_network_interfaces)";
        case " $before " in
          *" {{ tunnel_interface }} "*) echo unchanged; exit 0;;
        esac;
        new="$(echo "$before {{ tunnel_interface }}" | tr -s ' ' | sed 's/^ //;s/ $//')";
        uci set podkop.settings.source_network_interfaces="$new";
        uci commit podkop;
        /etc/init.d/podkop restart >/dev/null;
        echo changed
      register: podkop_interfaces
      changed_when: "'changed' in podkop_interfaces.stdout"

    - name: Enable and start the portal
      ansible.builtin.raw: "/etc/init.d/wg-portal enable; /etc/init.d/wg-portal start"
      changed_when: true

    - name: Wait for the portal to answer
      ansible.builtin.raw: >-
        wget -q -O /dev/null http://127.0.0.1:{{ portal_port }}/api/v0/auth/providers
      register: portal_http
      changed_when: false
      until: portal_http.rc == 0
      retries: 30
      delay: 2

    - name: Report the state of the portal
      ansible.builtin.raw: >-
        logread | tail -20; netstat -ltn; opkg status wg-portal
      register: portal_state
      changed_when: false

    - name: Report the state of the portal
      ansible.builtin.debug:
        msg: "{{ portal_state.stdout }}"

---
# The OpenWrt setup of the emulated router: the feed of the WireGuard kernel
# modules, the portal itself, the configuration of the portal and the service.
- name: Wait for the guest
  community.openwrt.command:
    cmd: "uname -a"
  register: opwrt_kernel
  until: opwrt_kernel.rc == 0
  retries: 60
  delay: 2

- name: Report the guest
  ansible.builtin.debug:
    msg: "{{ opwrt_kernel.stdout | trim }}"

- name: Accept the architectures of the packages
  # apk takes the list of the architectures from /etc/apk/arch, one per
  # line, and refuses a package whose architecture is not in it.
  community.openwrt.copy:
    content: |
      aarch64_generic
      aarch64_cortex-a53
    dest: /etc/apk/arch
    mode: "0644"

- name: Point apk at the feed of the kernel modules
  # The feeds of the firmware are replaced: the guest has no internet, the
  # feed of the check is the only one it can reach. The url of a feed is the
  # url of its index: a url that ends with ".adb" is taken as it is.
  community.openwrt.copy:
    content: |
      {{ wgp.feed_url }}
    dest: /etc/apk/repositories.d/distfeeds.list
    mode: "0644"

- name: Trust the feed of the portal and point apk at it
  # The index of the feed is signed with the key of the project, and apk
  # checks the signature against the keys it trusts in /etc/apk/keys — so
  # the key of the feed goes there.
  community.openwrt.apk_feed:
    url: "{{ wgp.wgp_feed_url }}"
    key: "{{ lookup('file', wgp.feed_pubkey) }}"
    key_name: wg-portal.pem
    file: /etc/apk/repositories.d/customfeeds.list

- name: Install the portal
  # Its dependency, the WireGuard kernel module, apk resolves on its own: it
  # takes it from the feed of OpenWrt, with the modules it needs. The cache
  # is updated first, so the feed of the check is known.
  community.openwrt.apk:
    name: wg-portal
    state: present
    update_cache: true
  register: opwrt_install

- name: Report the installation
  ansible.builtin.debug:
    msg: "{{ opwrt_install.stdout | default('') }}"

- name: Look for the files of the portal
  # apk writes the list of the files of a package when it installs it. The
  # module of the installation fails when the package is not there, so this is
  # a check of the files themselves.
  community.openwrt.stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/wg-portal
    - /etc/init.d/wg-portal
    - /lib/apk/packages/wg-portal.list
  register: opwrt_files

- name: Check that the portal is installed
  ansible.builtin.assert:
    that:
      - opwrt_files.results | map(attribute='stat.exists') | select('false') | list | length == 0
    fail_msg: "the files of the portal are missing"
    quiet: true

- name: Load the WireGuard kernel modules
  # OpenWrt has no modprobe, the modules are loaded by kmodloader. The
  # postinstall scripts of the packages load them already, so a failure here
  # is not a problem.
  community.openwrt.command:
    cmd: "kmodloader {{ item }}"
  loop: "{{ wgp.modules }}"
  failed_when: false
  changed_when: false

- name: Create the configuration directory of the portal
  community.openwrt.file:
    path: /etc/wg-portal
    state: directory
    mode: "0700"

- name: Write the configuration of the portal
  community.openwrt.template:
    src: "{{ template_dir }}/openwrt/config.yaml.j2"
    dest: /etc/wg-portal/config.yaml
    mode: "0600"

- name: Start the portal
  community.openwrt.service:
    name: wg-portal
    state: started
    enabled: true

- name: Report the state of the portal
  # The log of the router and the listening sockets: they tell what the portal
  # did when it does not answer.
  community.openwrt.command:
    cmd: "logread | tail -20; netstat -ltn; ps w | grep wg-portal || true"
    uses_shell: true
  register: opwrt_state
  changed_when: false

- name: Report the state of the portal
  ansible.builtin.debug:
    msg: "{{ opwrt_state.stdout }}"

- name: Wait for the portal to answer
  community.openwrt.command:
    cmd: "wget -q -O /dev/null http://127.0.0.1:{{ wgp.web_port }}/api/v0/auth/providers"
  register: opwrt_http
  until: opwrt_http.rc == 0
  retries: 90
  delay: 2

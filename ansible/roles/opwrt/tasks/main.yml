---
# The OpenWrt setup of the emulated router: the feed of the WireGuard kernel
# modules, the portal itself, the configuration of the portal and the service.
- name: Wait for the guest
  community.openwrt.command:
    cmd: "uname -a"
  register: opwrt_kernel
  until: opwrt_kernel.rc == 0
  retries: 60
  delay: 2

- name: Report the guest
  ansible.builtin.debug:
    msg: "{{ opwrt_kernel.stdout | trim }}"

- name: Accept the architectures of the packages
  community.openwrt.lineinfile:
    path: /etc/opkg.conf
    line: "arch {{ item }}"
    state: present
  loop: "{{ wgp.architectures }}"

- name: Copy the public key of the feed of the portal to the guest
  # opkg checks the signature of the index of a feed against the keys it
  # trusts, so the key of the feed goes into /etc/opkg/keys of the guest.
  community.openwrt.copy:
    src: "{{ wgp.feed_pubkey }}"
    dest: "/tmp/wg-portal.pub"
    mode: "0644"

- name: Trust the public key of the feed of the portal
  community.openwrt.command:
    cmd: "opkg-key add /tmp/wg-portal.pub"
  register: opwrt_key
  changed_when: false

- name: Report the key of the feed
  ansible.builtin.debug:
    msg: "{{ opwrt_key.stdout }}"

- name: Point opkg at the feeds of the check
  # The portal comes from the feed of this project, the kernel modules from
  # the feed of OpenWrt: opkg resolves the dependency of the portal on
  # kmod-wireguard against the index of that feed.
  community.openwrt.copy:
    content: |
      src wgp {{ wgp.wgp_feed_url }}
      src openwrt {{ wgp.feed_url }}
    dest: /etc/opkg/customfeeds.conf
    mode: "0644"

- name: Drop the feeds of the firmware
  # The guest has no internet: the only feed it can reach is the one of the
  # check.
  community.openwrt.copy:
    content: "# no internet in the guest: the only feed is the one of the check\n"
    dest: /etc/opkg/distfeeds.conf
    mode: "0644"

- name: Update the lists of opkg
  community.openwrt.command:
    cmd: "opkg update"
  register: opwrt_update
  changed_when: false
  until: opwrt_update.rc == 0
  retries: 15
  delay: 2

- name: Report the update of the lists
  ansible.builtin.debug:
    msg: "{{ opwrt_update.stdout }}"

- name: Install the portal
  # The portal is in the feed of this project: opkg finds it by its name and
  # checks the signature of the index of the feed against the key of it. Its
  # dependency, the WireGuard kernel module, opkg resolves on its own: it
  # takes it from the feed of OpenWrt, with the modules it needs.
  community.openwrt.command:
    cmd: "opkg install wg-portal"
  register: opwrt_install
  changed_when: false

- name: Report the installation
  ansible.builtin.debug:
    msg: "{{ opwrt_install.stdout }}"

- name: Check that the dependency was installed with the portal
  ansible.builtin.assert:
    that:
      - "'Installing kmod-wireguard' in opwrt_install.stdout"
    fail_msg: "opkg did not install kmod-wireguard as a dependency of the portal"
    quiet: true

- name: Check that the kernel module is installed
  community.openwrt.command:
    cmd: "opkg status kmod-wireguard"
  register: opwrt_kmod
  changed_when: false
  failed_when: "'Status: install ok installed' not in opwrt_kmod.stdout"

- name: Check that the portal is installed
  community.openwrt.command:
    cmd: "opkg status wg-portal"
  register: opwrt_status
  changed_when: false
  failed_when: "'Status: install user installed' not in opwrt_status.stdout"

- name: Load the WireGuard kernel modules
  # OpenWrt has no modprobe, the modules are loaded by kmodloader. The
  # postinstall scripts of the packages load them already, so a failure here
  # is not a problem — the check of the tunnel tells if the module is there.
  community.openwrt.command:
    cmd: "kmodloader {{ item }}"
  loop: "{{ wgp.modules }}"
  failed_when: false
  changed_when: false

- name: Create the configuration directory of the portal
  community.openwrt.file:
    path: /etc/wg-portal
    state: directory
    mode: "0700"

- name: Write the configuration of the portal
  community.openwrt.template:
    src: "{{ template_dir }}/openwrt/config.yaml.j2"
    dest: /etc/wg-portal/config.yaml
    mode: "0600"

- name: Start the portal
  community.openwrt.service:
    name: wg-portal
    state: started
    enabled: true

- name: Report the state of the portal
  # The log of the router and the listening sockets: they tell what the portal
  # did when it does not answer.
  community.openwrt.command:
    cmd: "logread | tail -20; netstat -ltn; ps w | grep wg-portal || true"
    uses_shell: true
  register: opwrt_state
  changed_when: false

- name: Report the state of the portal
  ansible.builtin.debug:
    msg: "{{ opwrt_state.stdout }}"

- name: Wait for the portal to answer
  community.openwrt.command:
    cmd: "wget -q -O /dev/null http://127.0.0.1:{{ wgp.web_port }}/api/v0/auth/providers"
  register: opwrt_http
  until: opwrt_http.rc == 0
  retries: 90
  delay: 2

---
# The checks of the installation of the package: what apk made of it, the
# service it enabled, the binary that answers HTTP — and that the package can
# be taken away again and installed once more.
- name: Look for the files of the package
  # The list of the files is written by apk when the package is installed, and
  # taken away with it. Its presence is the presence of the package.
  community.openwrt.stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/wg-portal
    - /etc/init.d/wg-portal
    - /lib/apk/packages/wg-portal.list
  register: package_files

- name: Report the files of the package
  ansible.builtin.debug:
    msg: >-
      {{ package_files.results | map(attribute='stat')
         | selectattr('exists') | map(attribute='path') | list }}

- name: Check that the package is installed
  ansible.builtin.assert:
    that:
      - package_files.results | map(attribute='stat.exists') | select('false') | list | length == 0
    fail_msg: "the files of the package are missing"
    quiet: true

- name: Read the links of the service
  community.openwrt.stat:
    path: "/etc/rc.d/{{ item }}"
  loop:
    - K01wg-portal
    - S99wg-portal
  register: package_services

- name: Report the links of the service
  ansible.builtin.debug:
    msg: >-
      {{ package_services.results | map(attribute='stat')
         | selectattr('exists') | map(attribute='path') | list }}

- name: Wait for the portal to answer
  community.openwrt.command:
    cmd: "wget -q -O /dev/null http://127.0.0.1:{{ wgp.web_port }}/api/v0/auth/providers"
  register: package_http
  until: package_http.rc == 0
  retries: 90
  delay: 2

- name: Measure the memory of the portal
  community.openwrt.command:
    cmd: "grep -E 'VmHWM|VmRSS' /proc/$(pidof wg-portal)/status"
    uses_shell: true
  register: package_memory
  changed_when: false

- name: Report the memory of the portal
  ansible.builtin.debug:
    msg: "{{ package_memory.stdout }}"

- name: Remove the package
  community.openwrt.apk:
    name: wg-portal
    state: absent

- name: Look for the files of the package again
  community.openwrt.stat:
    path: /lib/apk/packages/wg-portal.list
  register: package_removed

- name: Check that the package is gone
  ansible.builtin.assert:
    that:
      - not package_removed.stat.exists
    fail_msg: "the package is still installed"
    quiet: true

- name: Install the package again
  community.openwrt.apk:
    name: wg-portal
    state: present

- name: Look for the files of the package once more
  community.openwrt.stat:
    path: /lib/apk/packages/wg-portal.list
  register: package_again

- name: Check that the package is installed again
  ansible.builtin.assert:
    that:
      - package_again.stat.exists
    fail_msg: "the package is not installed"
    quiet: true

---
# The packaging of the portal: the release binary is downloaded, packed with
# UPX and put into an .ipk for opkg.
#
# The play runs in the toolbox image (Dockerfile.pkg), which brings ansible,
# UPX and GNU tar:
#
#   docker run --rm -v "$PWD/dist:/w" wg-portal-pkg:local
#
# The layout of the package is the one of the stock OpenWrt ipkg-build: an
# outer tar.gz holding debian-binary, control.tar.gz and data.tar.gz.
#
# The values of the package come from the environment of the container:
#
#   VER=v2.3.1 ARCH=aarch64_cortex-a53 REL=1
- name: Build the .ipk package
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/main.yml
  vars:
    work: "{{ lookup('env', 'W') | default('/w', true) }}"
    ver: "{{ lookup('env', 'VER') | default('v2.3.1', true) }}"
    arch: "{{ lookup('env', 'ARCH') | default('aarch64_cortex-a53', true) }}"
    rel: "{{ lookup('env', 'REL') | default('1', true) }}"
    pkg_ver: "{{ ver | regex_replace('^v', '') }}"
    repo: https://github.com/h44z/wg-portal/releases/download
  tasks:
    - name: Download the release binary
      ansible.builtin.get_url:
        url: "{{ repo }}/{{ ver }}/wg-portal_linux_arm64"
        dest: "{{ work }}/wg-portal.orig"
        mode: "0755"
        force: false

    - name: Copy the binary for the packing
      ansible.builtin.copy:
        src: "{{ work }}/wg-portal.orig"
        dest: "{{ work }}/wg-portal.packed"
        mode: "0755"
        remote_src: true

    - name: Pack the binary with UPX
      # --best --lzma is the smallest mode: LZMA alone is already close to the
      # best result and --best adds 70 kB on top of it.
      ansible.builtin.command:
        cmd: "upx --best --lzma {{ work }}/wg-portal.packed"
      changed_when: true

    - name: Check the packed binary
      ansible.builtin.command:
        cmd: "upx -t {{ work }}/wg-portal.packed"
      changed_when: false

    - name: Create the layout of the package
      ansible.builtin.file:
        path: "{{ work }}/pkg/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - data/usr/bin
        - data/etc/init.d
        - control

    - name: Put the binary into the package
      ansible.builtin.copy:
        src: "{{ work }}/wg-portal.packed"
        dest: "{{ work }}/pkg/data/usr/bin/wg-portal"
        mode: "0755"
        remote_src: true

    - name: Put the init script into the package
      ansible.builtin.template:
        src: "{{ template_dir }}/ipk/init.d.j2"
        dest: "{{ work }}/pkg/data/etc/init.d/wg-portal"
        mode: "0755"

    - name: Put the maintainer scripts into the package
      ansible.builtin.template:
        src: "{{ template_dir }}/ipk/{{ item }}.j2"
        dest: "{{ work }}/pkg/control/{{ item }}"
        mode: "0755"
      loop:
        - postinst
        - prerm

    - name: Measure the size of the package
      # opkg reads Installed-Size in bytes (it divides by 1024 itself), the
      # same as in the stock OpenWrt packages.
      ansible.builtin.command:
        cmd: "du -sb {{ work }}/pkg/data"
      register: pkg_size
      changed_when: false

    - name: Write the control file of the package
      ansible.builtin.template:
        src: "{{ template_dir }}/ipk/control.j2"
        dest: "{{ work }}/pkg/control/control"
        mode: "0644"
      vars:
        size: "{{ pkg_size.stdout | regex_search('^[0-9]+') }}"

    # unarchive cannot build the package: the archives have to hold the
    # members with the numeric ownership of opkg and the names the format
    # of the package needs.
    - name: Build the archives of the package # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "tar --numeric-owner --owner=0 --group=0 -C {{ work }}/pkg/{{ item }} -czf {{ work }}/pkg/{{ item }}.tar.gz ."
      loop:
        - data
        - control
      changed_when: true

    - name: Write the format of the package
      ansible.builtin.copy:
        content: "2.0\n"
        dest: "{{ work }}/pkg/debian-binary"
        mode: "0644"

    - name: Build the package # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: "tar -C {{ work }}/pkg -czf {{ work }}/wg-portal_{{ pkg_ver }}-{{ rel }}_{{ arch }}.ipk ./debian-binary ./control.tar.gz ./data.tar.gz"
      changed_when: true

    - name: Remove the layout of the package
      ansible.builtin.file:
        path: "{{ work }}/pkg"
        state: absent

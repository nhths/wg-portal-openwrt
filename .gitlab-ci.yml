---
# GitLab CI for the wg-portal package for OpenWrt.
#
# The lint stage runs the linters in the lint image of the group. The build
# stage builds the image of the WireGuard check: the emulated router with the
# portal inside and a WireGuard client next to it. The check itself needs a
# tun device and a privileged container, so it is run where there is one —
# see the README.

stages:
  - lint
  - build

variables:
  LINT_IMAGE: cr.knois.ru/pipelines/lint:latest

default:
  tags:
    - docker
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint:
  stage: lint
  image:
    name: ${LINT_IMAGE}
  script:
    - make lint

# The image bakes in the guest, the collection and the package itself, so
# building it is a smoke test of all three.
build:
  stage: build
  script:
    - make image DOCKER=podman

# The end-to-end check: the emulated router with the portal inside and a
# WireGuard client next to it, in one container. It needs a tun device, which
# not every runner has, so it is manual.
check:
  stage: build
  when: manual
  script:
    - make check-wireguard DOCKER=podman

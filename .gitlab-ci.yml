---
# GitLab CI for the wg-portal package for OpenWrt.
stages:
  - lint
  - build

variables:
  LINT_IMAGE: cr.knois.ru/pipelines/lint:latest

default:
  tags:
    - docker
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

lint:
  stage: lint
  image:
    name: ${LINT_IMAGE}
  script:
    - make lint

# The image bakes in the guest, the collection and the package itself, so
# building it is a smoke test of all three.
build:
  stage: build
  script:
    - make image DOCKER=podman

# The end-to-end check. It needs a tun device, which not every runner has,
# so it is manual.
check:
  stage: build
  when: manual
  script:
    - make check-wireguard DOCKER=podman
